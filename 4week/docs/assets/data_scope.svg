<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="405" viewBox="0 0 1160 405" role="img"><rect width="1160" height="405" rx="20" fill="#F4F8FA"/><text x="44" y="60" font-size="30" fill="#12263A" font-weight="700" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">목적에 맞는 영상이 먼저 필요합니다</text><text x="44" y="92" font-size="17" fill="#546A7B" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">영상의 촬영 범위와 길이는 모델 변경만으로 해결할 수 없습니다.</text><rect x="56" y="122" width="516" height="232" rx="12" fill="#fff" stroke="#C9DDE2" stroke-width="1.6"/><text x="81" y="158" font-size="21" fill="#12263A" font-weight="700" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">현재 확보한 영상</text><rect x="84" y="177" width="272" height="134" rx="6" fill="#EFF4F7" stroke="#C2D1D8"/><path d="M206 182 V306" stroke="#C3D1D7" stroke-width="4"/><rect x="241" y="198" width="77" height="79" rx="6" fill="#9BAFBD"/><circle cx="135" cy="233" r="10" fill="#008F83"/><circle cx="167" cy="255" r="10" fill="#008F83"/><path d="M116 282 L181 282" stroke="#D37D23" stroke-width="7" stroke-linecap="round"/><text x="382" y="211" font-size="15" fill="#546A7B" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">지금 가능한 것</text><text x="381" y="244" font-size="15" fill="#12263A" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">• 화면 안 사람 관측</text><text x="381" y="271" font-size="15" fill="#12263A" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">• 짧은 구간 이동 기록</text><text x="381" y="298" font-size="15" fill="#12263A" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">• 운영 통계 불가</text><text x="85" y="338" font-size="16" fill="#546A7B" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">키오스크·통로 일부 / 53초</text><rect x="612" y="122" width="516" height="232" rx="12" fill="#fff" stroke="#C9DDE2" stroke-width="1.6"/><text x="637" y="158" font-size="21" fill="#12263A" font-weight="700" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">필요한 영상</text><rect x="640" y="177" width="272" height="134" rx="6" fill="#EFF4F7" stroke="#C2D1D8"/><rect x="652" y="195" width="58" height="47" rx="6" fill="#A0C8C5"/><rect x="734" y="195" width="70" height="47" rx="6" fill="#A0C8C5"/><rect x="822" y="195" width="62" height="47" rx="6" fill="#A0C8C5"/><path d="M647 272 H892" stroke="#008F83" stroke-width="4" stroke-dasharray="12 7"/><circle cx="687" cy="281" r="9" fill="#008F83"/><circle cx="758" cy="281" r="9" fill="#008F83"/><circle cx="852" cy="281" r="9" fill="#008F83"/><text x="938" y="211" font-size="15" fill="#546A7B" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">필요 조건</text><text x="937" y="244" font-size="15" fill="#12263A" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">• 넓은 촬영 범위</text><text x="937" y="271" font-size="15" fill="#12263A" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">• 충분한 지속 시간</text><text x="937" y="298" font-size="15" fill="#12263A" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">• ROI·정답 검증</text><text x="641" y="338" font-size="16" fill="#546A7B" font-weight="500" text-anchor="start" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">출입구·주문대·좌석 / 장시간</text><text x="580" y="385" font-size="16" fill="#546A7B" font-weight="500" text-anchor="middle" font-family="NanumSquare, Noto Sans CJK KR, Arial, sans-serif">공개 데이터의 접근·배포 조건 확인이 필요하며, 검증되지 않은 외부 CCTV는 GitHub에 포함하지 않았습니다.</text></svg>